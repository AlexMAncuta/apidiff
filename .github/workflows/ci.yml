name: CI

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python:
    name: Comparator tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: api-diff-python/requirements.txt

      - name: Install dependencies
        working-directory: api-diff-python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        working-directory: api-diff-python
        env:
          KNOWLEDGE_SOURCE: local
          LOCAL_KNOWLEDGE_DIRECTORY: knowledge
        run: python -m unittest discover -s tests -v

  java:
    name: Mock API builds
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Build
        working-directory: api-mock
        run: ./mvnw -B package -DskipTests

  terraform:
    name: Terraform validates
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - name: Format check
        working-directory: terraform
        run: terraform fmt -check -recursive

      - name: Validate
        working-directory: terraform
        run: |
          terraform init -backend=false
          terraform validate

  docker:
    name: Image builds
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build image
        working-directory: api-diff-python
        run: docker build -t api-diff-assistant:ci .